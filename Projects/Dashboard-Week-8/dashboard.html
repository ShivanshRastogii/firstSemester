
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard</title>
    <link rel="stylesheet" href="Dashboard.css">
</head>
<body>

    <div class="dashboard">

        <!-- Top Header -->
        <header class="header">
            <h1>My Dashboard</h1>
            <p>Welcome back! Here's your overview.</p>
        </header>

        <!-- Side Menu -->
        <aside class="sidebar">
            <h2>Menu</h2>
            <ul>
                <li><a href="#">🏠 Home</a></li>
                <li><a href="#">📊 Reports</a></li>
                <li><a href="#">⚙️ Settings</a></li>
                <li><a href="#">👤 Profile</a></li>
            </ul>
        </aside>

        <!-- Main Dashboard Area -->
        <main class="main">

            <div class="card">
                <span class="icon">👤</span>
                <div class="card-info">
                    <h3>120</h3>
                    <p>Users</p>
                </div>
            </div>

            <div class="card">
                <span class="icon">💰</span>
                <div class="card-info">
                    <h3>Rs 45k</h3>
                    <p>Sales</p>
                </div>
            </div>

            <div class="card">
                <span class="icon">📦</span>
                <div class="card-info">
                    <h3>36</h3>
                    <p>Orders</p>
                </div>
            </div>

            <div class="card">
                <span class="icon">⭐</span>
                <div class="card-info">
                    <h3>4.8</h3>
                    <p>Rating</p>
                </div>
            </div>

            <div class="card">
                <span class="icon">💬</span>
                <div class="card-info">
                    <h3>18</h3>
                    <p>Messages</p>
                </div>
            </div>

            <div class="card">
                <span class="icon">✅</span>
                <div class="card-info">
                    <h3>92%</h3>
                    <p>Completed</p>
                </div>
            </div>

        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>Made with CSS Grid ❤️ | Week 8 Assignment</p>
        </footer>

    </div>

</body>
</html>
